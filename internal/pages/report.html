<!doctype html>
<!-- The report window. ledge loads this for a card's report, with the report as JSON
     in a <script id="report"> where the marker below is: {title, blocks}, the blocks
     being the event's `report` (event.schema.json in internal/store). The page draws
     them top to bottom under a title bar it draws itself, and does nothing else: it has
     no way to talk to ledge.

     block = {type: "heading", text} | {type: "text", text}
           | {type: "fields", items: [{label, value}]}
           | {type: "table", columns: [string], rows: [[string|number]]}
           | {type: "list", items: [string], ordered?} | {type: "code", text}
           | {type: "note", text, color?} | {type: "link", text, url}

     Report text is untrusted: it goes in through textContent, never innerHTML. A link
     is a real <a>; clicking it asks the window to navigate, and ledge opens http(s)
     urls in the browser instead and blocks everything else. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Layout only. How the report looks comes from its theme's report stylesheet
     (themes/<name>.report.css), added after this. A theme sets --page, an opaque
     colour behind everything, and --c-green, --c-yellow, --c-red, --c-blue and
     --c-gray for notes. A note has its colour in --note and data-color.

     The page fills the window, title bar included: macOS draws only the close,
     minimise and zoom buttons, at the top left. .titlebar is the page's own title
     bar under them, --titlebar high and kept clear of them, with the title in a
     <span>; a theme gives it a background and styles the title. Dragging it moves the
     window, and double-clicking it zooms, as a real one would.

     A theme can draw the whole window instead: with Frameless in pages.Frames, the
     window has no macOS frame (square corners, no buttons), and the theme shows the
     title bar's .close, .minimise and .zoom buttons, hidden here, and any border. */
  :root { --titlebar: 28px; }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body { margin: 0; padding: calc(var(--titlebar) + 18px) 24px 28px; overflow-wrap: anywhere; }
  .titlebar { position: fixed; z-index: 1; top: 0; left: 0; right: 0; height: var(--titlebar); padding: 0 78px;
              line-height: var(--titlebar); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              -webkit-user-select: none; cursor: default; }
  .titlebar button { display: none; margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: default; }
  main > * { margin: 0; }
  main > * + * { margin-top: 12px; }
  main > h2:first-child { margin-top: 0 !important; }
  h2 { font-size: 1.15em; margin-top: 20px !important; }
  p { white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
  .field { display: contents; }
  dt, dd { margin: 0; }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; min-width: 100%; }
  th, td { text-align: left; vertical-align: top; }
  ul, ol { padding-left: 1.5em; }
  pre { overflow-x: auto; white-space: pre; overflow-wrap: normal; }
  .note { white-space: pre-wrap; }
</style>
</head>
<body>
<header class="titlebar"><span></span><button class="minimise" title="Minimise" aria-label="Minimise"></button><button class="zoom" title="Zoom" aria-label="Zoom"></button><button class="close" title="Close" aria-label="Close"></button></header>
<main></main>
<!-- report -->
<script>
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value != null) node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child != null) node.append(child);
    }
    return node;
  }

  const named = ["green", "yellow", "red", "blue", "gray"];
  const cssColor = color => named.includes(color) ? `var(--c-${color})`
                          : /^#[0-9a-f]{6}$/i.test(color || "") ? color : "var(--c-gray)";

  const blocks = {
    heading: b => el("h2", {}, b.text),
    text: b => el("p", {}, b.text),
    fields: b => el("dl", {}, b.items.map(item => el("div", { class: "field" }, el("dt", {}, item.label), el("dd", {}, String(item.value))))),
    // Rows are cut or padded to the columns, so every row lines up.
    table: b => el("div", { class: "table" }, el("table", {},
      el("thead", {}, el("tr", {}, b.columns.map(c => el("th", {}, c)))),
      el("tbody", {}, b.rows.map(row => el("tr", {}, b.columns.map((_, i) => el("td", {}, row[i] == null ? "" : String(row[i])))))))),
    list: b => el(b.ordered ? "ol" : "ul", {}, b.items.map(item => el("li", {}, item))),
    code: b => el("pre", {}, el("code", {}, b.text)),
    note: b => el("div", { class: "note", "data-color": b.color || "gray", style: `--note: ${cssColor(b.color)}` }, b.text),
    link: b => el("p", { class: "link" }, el("a", { href: b.url, title: b.url }, b.text)),
  };

  const report = JSON.parse(document.getElementById("report").textContent);
  const titlebar = document.querySelector(".titlebar");
  titlebar.querySelector("span").textContent = report.title;
  document.querySelector("main").replaceChildren(...report.blocks.map(b => blocks[b.type]?.(b)).filter(Boolean));

  // All the page can ask of its window, through its "frame" handler: a mouse-down on
  // the title bar starts a drag (or, the second of a double-click, a zoom), and the
  // title bar's buttons, when a theme shows them, close, minimise and zoom it.
  const frame = action => window.webkit?.messageHandlers?.frame?.postMessage(action);
  titlebar.addEventListener("mousedown", e => {
    if (e.button === 0 && !e.target.closest("button")) frame("drag");
  });
  for (const action of ["close", "minimise", "zoom"]) {
    titlebar.querySelector("." + action).addEventListener("click", () => frame(action));
  }
</script>
</body>
</html>
