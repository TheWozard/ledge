<!doctype html>
<!-- The bar. ledge loads this into a borderless window stretched along one edge of a
     screen, gives the body element the class `top` or `bottom`, and calls
     render(events) whenever the store changes. Status pills come first, then events as
     cards in one row that scrolls sideways.

     The page talks to ledge only through send(action, id), which posts {action, id}
     (message.schema.json in internal/bar). It never sends a url, path or command:
     ledge looks up what it stored for that id. It sends "ready" once loaded.

     event  = {id, title, source, received, tags?: [string], description?, url?,
               priority?: high|medium|low, expires?,
               report?: a path to an HTML file (clicking the card shows it in the report window)}
     status = {id, kind: "status", title, source, received, url?, detail?, command?,
               color?, schedule?: [{at, color}], expires?}
     A status (kind "status") is a pill in `color`, switching to each schedule step's
     colour once its `at` time passes. Colours are a name from --c-* below or #rrggbb.

     Event text is untrusted: it goes in through textContent/setAttribute, never
     innerHTML. Nothing is a real link, since the window can't navigate: a status with
     a url sends "open" when its label is clicked. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bar: #ecebe8; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: rgba(0, 0, 0, .08);
    --accent: #2f5fd0; --high: #c4352b; --medium: #b7791f; --low: #5f7f5f;
    --c-green: #2f8f4e; --c-yellow: #c08a12; --c-red: #c4352b; --c-blue: #2f5fd0; --c-gray: #8a8a90;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bar: #151517; --card: #26262b; --text: #ececef; --muted: #9a9aa2; --line: rgba(255, 255, 255, .09);
      --accent: #7ea2ff; --high: #ff7b6e; --medium: #e8b55a; --low: #9cc29c;
      --c-green: #5cc27a; --c-yellow: #e8b55a; --c-red: #ff7b6e; --c-blue: #7ea2ff; --c-gray: #9a9aa2;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bar); overflow: hidden; }
  body { color: var(--text); font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
         -webkit-user-select: none; cursor: default; }

  /* The bar fills the window: status pills on the left, then the scrolling row of cards. */
  #app { display: flex; height: 100%; gap: 8px; padding: 8px; background: var(--bar);
         border-top: 1px solid var(--line); }
  body.top #app { border-top: 0; border-bottom: 1px solid var(--line); }

  /* Status pills stack in one column that scrolls vertically when they don't fit. */
  .pills { flex: none; display: flex; flex-direction: column; gap: 4px; max-width: 50%;
           overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { position: relative; flex: none; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
          border-radius: 999px; border: 1px solid var(--pill);
          background: color-mix(in srgb, var(--pill) 22%, var(--card)); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pill); flex: none; }
  .pill .label { font-weight: 600; color: var(--text); }
  .pill.opens .label { cursor: pointer; }
  .pill.opens .label:hover { text-decoration: underline; }
  /* A pill with a command is a button: clicking it runs the command, and it flashes. */
  .pill.runs { cursor: pointer; }
  .pill.runs:hover { background: color-mix(in srgb, var(--pill) 36%, var(--card)); }
  .pill.ran { animation: ran .6s; }
  @keyframes ran { from { background: var(--pill); } }

  ul { flex: 1; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; gap: 8px;
       overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  ul::-webkit-scrollbar { display: none; }
  li { position: relative; flex: none; width: 280px; height: 100%; display: flex; flex-direction: column;
       padding: 7px 10px; border-radius: 8px; background: var(--card);
       border: 1px solid var(--line); border-left: 3px solid transparent; overflow: hidden; }
  /* A card with a report or a url opens it when clicked. Hover outlines three sides so
     the left edge keeps its priority colour. */
  li.opens { cursor: pointer; }
  li.opens:hover { border-top-color: var(--accent); border-right-color: var(--accent); border-bottom-color: var(--accent); }
  li.high { border-left-color: var(--high); }
  li.medium { border-left-color: var(--medium); }
  li.low { border-left-color: var(--low); }
  /* The title clamps so a long one can't push the meta line out of the card. */
  /* Title, description, then the meta line pinned to the bottom: source and age on the
     left, tags on the right. Title and description clamp; the description gives way
     first if the card runs out of height. If the tags don't fit, they're the ones cut. */
  .tags { display: flex; justify-content: flex-end; gap: 4px; overflow: hidden; min-width: 0; margin-left: auto; }
  /* Only the title shares the top line with ×, so only it keeps clear of it. */
  .title { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 2; flex: none;
           margin-right: 16px;
           font-weight: 600; font-size: 13px; line-height: 1.3; color: var(--text); }
  .description { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 2;
                 min-height: 0; flex: 0 1 auto; color: var(--muted); margin-top: 1px; }
  .meta .when { flex: none; }
  .meta { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; margin-top: auto; padding-top: 3px;
          color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .tag { display: inline-block; flex: none; font-size: 10px; padding: 0 6px; border-radius: 999px;
         border: 1px solid var(--line); line-height: 16px; color: var(--muted); }

  .dismiss { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border: 0; border-radius: 4px;
             background: none; color: var(--muted); font-size: 14px; line-height: 18px; padding: 0;
             cursor: pointer; }
  .dismiss:hover { background: var(--line); color: var(--text); }

  .empty { flex: 1; display: flex; align-items: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const app = document.getElementById("app");

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value != null) node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child != null) node.append(child);
    }
    return node;
  }

  // Everything the page asks of ledge: an action and the id it applies to.
  function send(action, id) {
    window.webkit.messageHandlers.ledge.postMessage(id == null ? { action } : { action, id });
  }

  function ago(iso) {
    const minutes = Math.round((Date.now() - new Date(iso)) / 60000);
    if (minutes < 1) return "now";
    if (minutes < 60) return `${minutes}m`;
    if (minutes < 60 * 24) return `${Math.round(minutes / 60)}h`;
    return `${Math.round(minutes / 60 / 24)}d`;
  }

  function renderEvent(event) {
    const dismiss = el("button", { class: "dismiss", title: "Dismiss" }, "×");
    dismiss.addEventListener("click", () => send("dismiss", event.id));
    const opens = event.report ? "report" : event.url ? "link" : null;
    const card = el("li", { class: [event.priority, opens ? "opens" : null].filter(Boolean).join(" ") || null,
                            title: event.url || null },
      dismiss,
      el("span", { class: "title" }, event.title),
      event.description ? el("div", { class: "description" }, event.description) : null,
      el("div", { class: "meta" },
        el("span", { class: "when" }, `${event.source} · ${ago(event.received)}`),
        event.tags?.length ? el("div", { class: "tags" }, event.tags.map(tag => el("span", { class: "tag" }, tag))) : null));
    // Anywhere but × opens the report or the url. Only the id goes back to ledge,
    // which opens what it stored for that id.
    if (opens) {
      card.addEventListener("click", e => e.target.closest("button") || send("open", event.id));
    }
    return card;
  }

  const named = ["green", "yellow", "red", "blue", "gray"];
  const cssColor = color => named.includes(color) ? `var(--c-${color})`
                          : /^#[0-9a-f]{6}$/i.test(color || "") ? color : "var(--c-gray)";

  // The colour a status shows now: its last schedule step whose time has passed, or its
  // own colour before any have.
  function colorNow(status, now = Date.now()) {
    const passed = (status.schedule || []).filter(step => new Date(step.at) <= now);
    return passed.length ? passed[passed.length - 1].color : status.color;
  }

  // A pill: dot and label. The tooltip lists the detail, the command a click runs, and
  // the colour changes still to come. Only the id goes back to ledge, which runs the
  // command or opens the url it has stored for that id, so the page can't run or open
  // anything else.
  function renderStatus(status) {
    const upcoming = (status.schedule || []).filter(step => new Date(step.at) > Date.now());
    const time = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const tip = [status.detail, status.command ? `Click to run: ${status.command}` : null,
                 ...upcoming.map(step => `${step.color} at ${time(step.at)}`)].filter(Boolean).join("\n");
    const opens = !status.command && /^https?:\/\//i.test(status.url || "");
    const pill = el("div", { class: ["pill", status.command ? "runs" : null, opens ? "opens" : null].filter(Boolean).join(" "),
                             style: `--pill: ${cssColor(colorNow(status))}`, title: tip || null },
      el("span", { class: "dot" }),
      el("span", { class: "label" }, status.title));
    if (opens) {
      pill.querySelector(".label").addEventListener("click", () => send("open", status.id));
    }
    if (status.command) {
      pill.addEventListener("click", () => {
        pill.classList.remove("ran");
        void pill.offsetWidth;          // restart the flash if it's clicked again quickly
        pill.classList.add("ran");
        send("run", status.id);
      });
    }
    return pill;
  }

  // Re-render when the next scheduled colour change is due, not just on the minute.
  let latest = [];
  let changeTimer = null;
  function scheduleNextChange(statuses) {
    clearTimeout(changeTimer);
    const next = Math.min(...statuses.flatMap(s => (s.schedule || []).map(step => new Date(step.at).getTime()))
                                  .filter(t => t > Date.now()));
    if (Number.isFinite(next)) changeTimer = setTimeout(() => render(latest), Math.min(next - Date.now() + 50, 2 ** 31 - 1));
  }

  // Keep the row's and the pills' scroll positions across re-renders, so a new event
  // arriving doesn't jump you back to the start while you're reading further along.
  function render(all) {
    latest = all;
    const statuses = all.filter(e => e.kind === "status").sort((a, b) => a.title.localeCompare(b.title));
    const events = all.filter(e => e.kind !== "status");
    const scrolled = app.querySelector("ul")?.scrollLeft || 0;
    const scrolledPills = app.querySelector(".pills")?.scrollTop || 0;
    app.replaceChildren(...[
      statuses.length ? el("div", { class: "pills" }, statuses.map(renderStatus)) : null,
      events.length ? el("ul", {}, events.map(renderEvent)) : el("div", { class: "empty" }, "No events.")].filter(Boolean));
    const row = app.querySelector("ul");
    if (row) row.scrollLeft = scrolled;
    const pills = app.querySelector(".pills");
    if (pills) pills.scrollTop = scrolledPills;
    scheduleNextChange(statuses);
  }

  // A mouse wheel only scrolls vertically; turn that into sideways scrolling of the row.
  // Over the pills it's left alone, since they scroll vertically.
  app.addEventListener("wheel", event => {
    const row = app.querySelector("ul");
    if (!row || event.target.closest(".pills") || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    row.scrollLeft += event.deltaY;
    event.preventDefault();
  }, { passive: false });

  // Relative times ("5m") go stale; redraw once a minute.
  setInterval(() => render(latest), 60000);
  send("ready");
</script>
</body>
</html>
