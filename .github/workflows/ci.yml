name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # macOS: ledge only runs there, and the window shim needs cgo against AppKit.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15 # biome.json's schema; a newer one can change the rules
      # templ's CLI at go.mod's version of it, so an update to it there is checked
      # with the CLI it needs.
      - name: Install just and templ
        run: |
          brew install just
          go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)
      - name: The lint (Biome and gofmt)
        run: just lint
      - name: The *_templ.go files match the .templ files
        run: just check-generated
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go build ./...
      - run: go test -race ./...

  gui:
    # The tests that open the bar's windows, through ledge. A runner's window server
    # can be flaky, so a failure here is reported but doesn't fail the run. The
    # frontend's own window tests run only locally, with just gui.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./internal/bar
        env:
          LEDGE_GUI_TEST: "1"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -x --severity=warning scripts/*.sh
